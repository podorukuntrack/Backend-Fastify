name: Database Daily Backup

on:
  schedule:
    # Berjalan setiap hari pada jam 00:00 UTC (jam 07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan script ini secara manual (tombol Run Workflow)

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Set Variables
      id: vars
      run: |
        echo "TIMESTAMP=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
        echo "FILENAME=podorukuntrack_backup_$(date +'%Y%m%d_%H%M%S').sql.gz" >> $GITHUB_ENV

    - name: Dump Database and Compress
      env:
        # Gunakan session pooler atau direct connection. pg_dump membuka cursor
        # dan menjaga state sesi sepanjang proses dump — keduanya tidak bertahan
        # di transaction pooler, yang memindahkan koneksi antar transaksi.
        BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        # Samakan dengan versi mayor server database. Atur lewat repository
        # variable PG_MAJOR (Settings > Secrets and variables > Actions >
        # Variables) bila penyedia database memakai versi selain di bawah ini.
        PG_MAJOR: ${{ vars.PG_MAJOR || '18' }}
      run: |
        if [ -z "$BACKUP_DATABASE_URL" ]; then
          echo "::error::Secret BACKUP_DATABASE_URL belum diisi."
          exit 1
        fi
        # pipefail wajib: tanpa ini, pg_dump yang gagal tetap menghasilkan file
        # .gz (berisi output kosong) dan exit code yang dibaca adalah milik gzip,
        # sehingga job berwarna hijau padahal backup-nya kosong.
        set -o pipefail
        docker run --rm -e BACKUP_DATABASE_URL "postgres:${PG_MAJOR}" \
          sh -c 'pg_dump "$BACKUP_DATABASE_URL" -O -x' | gzip > ${{ env.FILENAME }}

    - name: Verify Dump Is Not Empty
      run: |
        # Lapis kedua terhadap backup kosong: dump skema penuh proyek ini jauh
        # di atas 50 KB terkompresi, jadi apa pun di bawah itu menandakan dump
        # terpotong walau exit code-nya nol.
        SIZE=$(stat -c%s ${{ env.FILENAME }})
        echo "Ukuran backup: ${SIZE} byte"
        if [ "$SIZE" -lt 51200 ]; then
          echo "::error::Backup hanya ${SIZE} byte — kemungkinan besar dump gagal atau terpotong."
          exit 1
        fi
        # Pastikan isinya benar-benar dump SQL, bukan pesan error yang terkompresi.
        if ! gzip -dc ${{ env.FILENAME }} | head -n 20 | grep -q 'PostgreSQL database dump'; then
          echo "::error::Isi file bukan dump PostgreSQL yang valid."
          exit 1
        fi

    - name: Upload Backup to Cloudflare R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      run: |
        # Mengunggah ke Cloudflare R2 menggunakan AWS CLI bawaan runner.
        # Backup sebelum migrasi database tersimpan di prefix lama neon-backups/
        # pada bucket yang sama — jangan dihapus, itu satu-satunya salinan data
        # dari periode tersebut.
        aws s3 cp ${{ env.FILENAME }} s3://$R2_BUCKET_NAME/database-backups/${{ env.FILENAME }} \
          --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com

    - name: Clean up local file
      run: rm ${{ env.FILENAME }}
