name: podorukuntrack-prod

services:
  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: podorukuntrack_redis_prod
    restart: always
    # Nilai cadangan dihapus: apa pun yang tertulis di sini ikut ter-commit dan
    # menjadi kata sandi publik. Sintaks `:?` membuat `docker compose up` berhenti
    # dengan pesan jelas bila variabelnya belum diisi — lebih baik gagal daripada
    # berjalan dengan kredensial yang diketahui umum.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env}
    ports:
      # Prefix 127.0.0.1 wajib. Backend jalan di host lewat PM2, jadi port perlu
      # dipublish — tapi tanpa prefix ini Docker menulis aturan DNAT di chain
      # DOCKER yang diproses sebelum ufw, sehingga port terbuka ke internet
      # walau firewall menampilkan deny.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proptrack_prod_net

  # ── Uptime Kuma ────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: podorukuntrack_uptime_kuma
    restart: always
    ports:
      # Dashboard internal. Akses lewat SSH tunnel:
      #   ssh -L 3001:127.0.0.1:3001 podorukuntrack@<IP-VPS>
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data_prod:/app/data
    networks:
      - proptrack_prod_net

  # ── WAHA (WhatsApp HTTP API) ───────────────────────────────────
  waha:
    image: devlikeapro/waha:latest
    container_name: podorukuntrack_whatsapp_prod
    restart: always
    ports:
      # Backend memanggil WAHA lewat localhost. Tidak boleh terbuka ke internet:
      # siapa pun yang menjangkaunya bisa kirim pesan atas nama nomor bisnis dan
      # membaca riwayat chat.
      - "127.0.0.1:2785:3000"
    volumes:
      - whatsapp_data_prod:/app/.wwebjs_auth
    environment:
      # Kunci API dan kata sandi dashboard tidak boleh punya nilai cadangan di file
      # yang ter-commit. WAHA_API_KEY harus sama dengan OPENWA_API_KEY di .env
      # backend, karena itulah kunci yang dikirim backend lewat header X-Api-Key.
      - WAHA_API_KEY=${WAHA_API_KEY:?WAHA_API_KEY wajib diisi di .env}
      - WAHA_GOWS_PATH=/app/gows
      - WAHA_GOWS_SOCKET=/tmp/gows.sock
      - WAHA_ZIPPER=ZIPUNZIP
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD wajib diisi di .env}
      - WHATSAPP_SWAGGER_USERNAME=${WHATSAPP_SWAGGER_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WHATSAPP_SWAGGER_PASSWORD:?WHATSAPP_SWAGGER_PASSWORD wajib diisi di .env}
    networks:
      - proptrack_prod_net

volumes:
  redis_data_prod:
  uptime_kuma_data_prod:
  whatsapp_data_prod:

networks:
  proptrack_prod_net:
    driver: bridge
